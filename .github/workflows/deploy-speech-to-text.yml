name: Deploy Speech-to-Text MVP to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/add-openclaw-0zs2g
    paths:
      - 'speech-to-text-mvp/**'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./speech-to-text-mvp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './speech-to-text-mvp/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Verify API keys are set
        run: |
          if [ -z "$VITE_DEEPGRAM_API_KEY" ]; then
            echo "ERROR: VITE_DEEPGRAM_API_KEY secret is not set!"
            exit 1
          else
            echo "VITE_DEEPGRAM_API_KEY is set (length: ${#VITE_DEEPGRAM_API_KEY})"
          fi
          if [ -z "$VITE_GROQ_API_KEY" ]; then
            echo "WARNING: VITE_GROQ_API_KEY is not set — chat feature will be disabled"
          else
            echo "VITE_GROQ_API_KEY is set (length: ${#VITE_GROQ_API_KEY})"
          fi
          if [ -z "$VITE_GOOGLE_TTS_KEY" ]; then
            echo "WARNING: VITE_GOOGLE_TTS_KEY is not set — Finnish TTS (Google) will be disabled"
          else
            echo "VITE_GOOGLE_TTS_KEY is set (length: ${#VITE_GOOGLE_TTS_KEY})"
          fi
          if [ -z "$VITE_ELEVENLABS_API_KEY" ]; then
            echo "WARNING: VITE_ELEVENLABS_API_KEY is not set — Finnish TTS (ElevenLabs) will be disabled"
          else
            echo "VITE_ELEVENLABS_API_KEY is set (length: ${#VITE_ELEVENLABS_API_KEY})"
          fi
        env:
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GOOGLE_TTS_KEY: ${{ secrets.VITE_GOOGLE_TTS_KEY }}
          VITE_ELEVENLABS_API_KEY: ${{ secrets.VITE_ELEVENLABS_API_KEY }}

      - name: Build
        run: npm run build
        env:
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GOOGLE_TTS_KEY: ${{ secrets.VITE_GOOGLE_TTS_KEY }}
          VITE_ELEVENLABS_API_KEY: ${{ secrets.VITE_ELEVENLABS_API_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './speech-to-text-mvp/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
